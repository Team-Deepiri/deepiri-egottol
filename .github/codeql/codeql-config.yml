# Exclude generated/build/runtime artifact paths.
paths-ignore:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/coverage/**'
  - '**/logs/**'
  - '**/*.min.js'
  - '**/*.min.css'
  - '**/*.o'
  - '**/*.obj'
  - '**/*.exe'
  - '**/*.dll'
  - '**/*.so'
  - '**/CMakeFiles/**'
  - '**/cmake-build-*/**'
  - '**/.vscode/**'
  - '**/.idea/**'
  - '**/.git/**'
  - '**/__pycache__/**'
  - '**/*.pyc'
  - '**/*.pyo'
  - '**/*.egg-info/**'
  - '**/.mypy_cache/**'
  - '**/.pytest_cache/**'
