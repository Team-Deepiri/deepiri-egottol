name: CI

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    timeout-minutes: 20
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install --upgrade "poetry==2.3.2"

      - name: Validate Poetry project
        run: poetry check

      - name: Install Python dependencies
        run: poetry install --no-root --no-interaction

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake build-essential qt6-base-dev libxcb-cursor0 python3-dev

      - name: Build C++ core and Python extension
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=ON
          cmake --build build --parallel

      - name: Run CMake tests
        run: ctest --test-dir build --output-on-failure

      - name: Run Python tests
        run: poetry run pytest
