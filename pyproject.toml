[project]
name = "deepiri-egottol"
version = "1.0.0"
description = "Modern Binary Electrical Systems & Avionics Lab"
authors = [
    {name = "Deepiri"}
]
requires-python = ">=3.12"
dependencies = [
    "numpy (>=2.4.4,<3.0.0)",
    "cloudpickle (>=3.1.2,<4.0.0)",
    "pyqt6 (>=6.11.0,<7.0.0)",
    "pydantic (>=2.13.1,<3.0.0)",
    "pyqtgraph (>=0.14.0,<0.15.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "aiohttp (>=3.13.5,<4.0.0)"
]

[project.optional-dependencies]
ai = ["onnxruntime (>=1.17.0,<2.0.0)", "onnx (>=1.15.0,<2.0.0)"]
gpu = ["cupy"]
rtl = []

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
packages = ["egottol"]
exclude = ["build/", "vhdl/"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.15.22,<0.16.0)",
    "mypy (>=2.3.0,<3.0.0)"
]
